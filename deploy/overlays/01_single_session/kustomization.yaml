# First deploy: one warm sandbox, no autoscaler.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# params.env / params.yaml are generated by `make deploy` from your .env.
configMapGenerator:
  - name: pdf-agent-config
    behavior: merge
    envs:
      - params.env

patches:
  - path: params.yaml
  - target:
      group: extensions.agents.x-k8s.io
      kind: SandboxWarmPool
      name: pdf-agent-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: pdf-agent-stats-adapter
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pdf-agent-stats-adapter
