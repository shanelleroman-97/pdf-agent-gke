apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdf-agent-stats-adapter
  annotations:
    iam.gke.io/gcp-service-account: PATCHED_BY_OVERLAY
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pdf-agent-stats-adapter
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxwarmpools/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pdf-agent-stats-adapter
subjects:
  - kind: ServiceAccount
    name: pdf-agent-stats-adapter
roleRef:
  kind: Role
  name: pdf-agent-stats-adapter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-agent-stats-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-agent-stats-adapter
  template:
    metadata:
      labels:
        app: pdf-agent-stats-adapter
    spec:
      serviceAccountName: pdf-agent-stats-adapter
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stats-adapter
          image: pdf-agent-stats-adapter
          imagePullPolicy: IfNotPresent
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: value
            - name: ANTHROPIC_ENVIRONMENT_ID
              valueFrom:
                configMapKeyRef:
                  name: pdf-agent-config
                  key: environment_id
            - name: PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: pdf-agent-config
                  key: project_id
            - name: SANDBOX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_WARMPOOL
              value: pdf-agent-worker
            - name: DIRECT_PATCH
              value: "true"
            - name: WARMPOOL_MIN
              value: "2"
            - name: WARMPOOL_MAX
              value: "20"
            - name: POLL_INTERVAL_SECONDS
              value: "15"
            - name: METRIC_TYPE
              value: custom.googleapis.com/pdf_agent/work_depth
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
